name: Create Linux Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

      release_notes:
        description: "Custom release notes (optional; commit titles are used when empty)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Calculate release version
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        shell: bash
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail

          previous_tag="$(git tag --sort=-v:refname | head -n 1 || true)"

          if [[ -n "$previous_tag" ]]; then
            current="${previous_tag#v}"
          else
            current="0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "$current"

          case "$VERSION_BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown version bump: $VERSION_BUMP" >&2
              exit 1
              ;;
          esac

          version="$major.$minor.$patch"
          tag="v$version"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          echo "Previous tag: ${previous_tag:-none}"
          echo "New version: $version"
          echo "New tag: $tag"

          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish release
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build release packages
        shell: bash
        run: ./packaging/build-packages.sh "${{ needs.version.outputs.version }}"

      - name: Create release notes
        shell: bash
        env:
          CUSTOM_NOTES: ${{ inputs.release_notes }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
          NEW_TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$CUSTOM_NOTES" ]]; then
            changes="$CUSTOM_NOTES"
          elif [[ -n "$PREVIOUS_TAG" ]] && git rev-parse "$PREVIOUS_TAG" >/dev/null 2>&1; then
            changes="$(git log --no-merges --pretty='format:- %s (`%h`)' "$PREVIOUS_TAG..$GITHUB_SHA")"
          else
            changes="$(git log --no-merges --pretty='format:- %s (`%h`)' "$GITHUB_SHA" -n 20)"
          fi

          if [[ -z "$changes" ]]; then
            changes="- Package/release refresh."
          fi

          cat > release-notes.md <<EOF_NOTES
          ## FL Studio Discord RPC ${NEW_TAG}

          Native Linux x86-64 packages. Installation and removal are handled by your distro package manager; `setup.sh` and `uninstall.sh` are no longer required.

          ### Install

          **Debian / Ubuntu / Linux Mint**

          \`\`\`bash
          sudo apt install ./flstudiorpc_${VERSION}_amd64.deb
          \`\`\`

          **Fedora / RHEL-family**

          \`\`\`bash
          sudo dnf install ./flstudiorpc-${VERSION}-1.x86_64.rpm
          \`\`\`

          **Arch Linux / CachyOS / EndeavourOS**

          \`\`\`bash
          sudo pacman -U ./flstudiorpc-${VERSION}-1-x86_64.pkg.tar.zst
          \`\`\`

          ### Uninstall

          \`\`\`bash
          # Debian / Ubuntu / Mint
          sudo apt remove flstudiorpc

          # Fedora / RHEL-family
          sudo dnf remove flstudiorpc

          # Arch Linux / CachyOS / EndeavourOS
          sudo pacman -Rns flstudiorpc
          \`\`\`

          The package manager owns and removes the executable, application-menu entry, installed icons, and license file. Per-user preferences under \`~/.config\` are intentionally preserved.

          ### What's Changed

          ${changes}

          ### Files

          - \`.deb\` for Debian, Ubuntu, Linux Mint and derivatives
          - \`.rpm\` for Fedora/RHEL-family distributions
          - \`.pkg.tar.zst\` for Arch Linux and derivatives
          - \`SHA256SUMS\` for artifact verification
          EOF_NOTES

          cat release-notes.md

      - name: Verify release assets
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -s "dist/flstudiorpc_${VERSION}_amd64.deb"
          test -s "dist/flstudiorpc-${VERSION}-1.x86_64.rpm"
          test -s "dist/flstudiorpc-${VERSION}-1-x86_64.pkg.tar.zst"
          test -s "dist/SHA256SUMS"
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FL Studio Discord RPC ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        shell: bash
        run: |
          echo "### Release created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: **${{ needs.version.outputs.tag }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous: **${{ needs.version.outputs.previous_tag || 'none' }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Packages: DEB, RPM, Arch Linux" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
