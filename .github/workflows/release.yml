name: Create Linux Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

      release_notes:
        description: "Custom release notes (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Get latest tag
        id: get_tag
        shell: bash
        run: |
          latest_tag=$(git tag --sort=-v:refname | head -n 1)

          if [[ -z "$latest_tag" ]]; then
            latest_tag="v1.0.0"
          fi

          echo "Latest tag: $latest_tag"
          echo "current_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: new_version
        shell: bash
        env:
          CURRENT_TAG: ${{ steps.get_tag.outputs.current_tag }}
          VERSION_BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          version="${CURRENT_TAG#v}"

          IFS='.' read -r major minor patch <<< "$version"

          case "$VERSION_BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_version="$major.$minor.$patch"
          new_tag="v$new_version"

          echo "New version: $new_version"
          echo "New tag: $new_tag"

          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Linux x64 application
        run: |
          dotnet publish FLStudioRPC.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output publish/linux-x64 \
            /p:PublishSingleFile=true \
            /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Prepare release package
        shell: bash
        env:
          VERSION: ${{ steps.new_version.outputs.new_version }}
        run: |
          PACKAGE_DIR="release/FLStudioRPC-linux-x64"
          ARCHIVE="FLStudioRPC-linux-x64-v${VERSION}.tar.gz"

          rm -rf release
          mkdir -p "$PACKAGE_DIR"

          cp publish/linux-x64/FLStudioRPC "$PACKAGE_DIR/FLStudioRPC"

          cp -a Icons "$PACKAGE_DIR/Icons"

          cp installer/setup.sh "$PACKAGE_DIR/setup.sh"
          cp installer/uninstall.sh "$PACKAGE_DIR/uninstall.sh"

          chmod +x \
            "$PACKAGE_DIR/FLStudioRPC" \
            "$PACKAGE_DIR/setup.sh" \
            "$PACKAGE_DIR/uninstall.sh"

          tar -czf "release/$ARCHIVE" \
            -C release \
            "FLStudioRPC-linux-x64"

          echo "Created package:"
          ls -lh "release/$ARCHIVE"

      - name: Verify release package
        shell: bash
        run: |
          PACKAGE="release/FLStudioRPC-linux-x64"

          test -f "$PACKAGE/FLStudioRPC"
          test -f "$PACKAGE/setup.sh"
          test -f "$PACKAGE/uninstall.sh"
          test -f "$PACKAGE/Icons/hicolor/128x128/apps/flstudio.png"

          echo "Release package contents:"
          find "$PACKAGE" -type f -print

      - name: Create release notes
        id: release_notes
        shell: bash
        env:
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
          NEW_TAG: ${{ steps.new_version.outputs.new_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -n "$CUSTOM_NOTES" ]]; then
            notes="$CUSTOM_NOTES"
          else
            notes="See the [commit history](https://github.com/$REPOSITORY/commits/$NEW_TAG) for detailed changes."
          fi

          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.new_version.outputs.new_tag }}
          name: FL Studio Discord RPC ${{ steps.new_version.outputs.new_tag }}
          body: |
            ## FL Studio Discord RPC ${{ steps.new_version.outputs.new_tag }}

            Linux x86-64 release.

            ### Installation

            1. Download `FLStudioRPC-linux-x64-v${{ steps.new_version.outputs.new_version }}.tar.gz`
            2. Extract the archive.
            3. Enter the extracted `FLStudioRPC-linux-x64` directory.
            4. Run:

               ```bash
               sudo ./setup.sh
               ```

            5. The application will be available from your application menu.

            ### Uninstallation

            Extract the same archive and run:

            ```bash
            sudo ./uninstall.sh
            ```

            ### What's Changed

            ${{ steps.release_notes.outputs.notes }}

            ---

            Generated automatically with GitHub Actions.
          files: release/FLStudioRPC-linux-x64-v${{ steps.new_version.outputs.new_version }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        shell: bash
        run: |
          echo "Release created successfully!"
          echo
          echo "Version: ${{ steps.new_version.outputs.new_tag }}"
          echo "Previous: ${{ steps.get_tag.outputs.current_tag }}"
          echo
          echo "https://github.com/${{ github.repository }}/releases/tag/${{ steps.new_version.outputs.new_tag }}"