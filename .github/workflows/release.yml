name: Create Linux Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: "Custom release notes (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Get latest tag
        id: get_tag
        shell: bash
        run: |
          latest_tag=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$latest_tag" ]; then
            latest_tag="v1.0.2"
          fi

          echo "Latest tag: $latest_tag"
          echo "current_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: new_version
        shell: bash
        run: |
          current_tag="${{ steps.get_tag.outputs.current_tag }}"
          version_only="${current_tag#v}"

          IFS='.' read -r major minor patch <<< "$version_only"

          case "${{ github.event.inputs.version_bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_tag="v${major}.${minor}.${patch}"
          new_version="${major}.${minor}.${patch}"

          echo "New version: $new_tag"

          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Linux x64 release
        run: |
          dotnet publish FLStudioRPC.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o publish/linux-x64

      - name: Prepare release package
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release/FLStudioRPC-linux-x64

          cp publish/linux-x64/FLStudioRPC \
             release/FLStudioRPC-linux-x64/

          cp -r Icons \
             release/FLStudioRPC-linux-x64/

          cp installer/setup.sh \
             release/FLStudioRPC-linux-x64/

          cp installer/uninstall.sh \
             release/FLStudioRPC-linux-x64/

          chmod +x release/FLStudioRPC-linux-x64/FLStudioRPC
          chmod +x release/FLStudioRPC-linux-x64/setup.sh
          chmod +x release/FLStudioRPC-linux-x64/uninstall.sh

      - name: Create archive
        shell: bash
        run: |
          cd release

          tar -czf \
            "FLStudioRPC-linux-x64-${{ steps.new_version.outputs.new_version }}.tar.gz" \
            FLStudioRPC-linux-x64

      - name: Create release notes
        id: release_notes
        shell: bash
        run: |
          custom_notes="${{ github.event.inputs.release_notes }}"
          new_tag="${{ steps.new_version.outputs.new_tag }}"
          repo="${{ github.repository }}"

          if [ -n "$custom_notes" ]; then
            change_log="$custom_notes"
          else
            change_log="See the [commit history](https://github.com/$repo/commits/$new_tag) for detailed changes."
          fi

          {
            echo "notes<<EOF"
            echo "$change_log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.new_version.outputs.new_tag }}
          name: FL Studio Discord RPC ${{ steps.new_version.outputs.new_tag }}
          body: |
            ## FL Studio Discord RPC ${{ steps.new_version.outputs.new_tag }}

            Linux release.

            ### Download

            Download:

            `FLStudioRPC-linux-x64-${{ steps.new_version.outputs.new_version }}.tar.gz`

            ### Installation

            1. Extract the archive.
            2. Open the `FLStudioRPC-linux-x64` directory.
            3. Run `setup.sh`.
            4. The installer will install the application and create the necessary desktop integration.
            5. The application will start automatically in the system tray.

            ### Uninstallation

            The downloaded package also contains:

            `uninstall.sh`

            Run it to completely remove the installed application.

            ### What's Changed

            ${{ steps.release_notes.outputs.notes }}

            ---

            Generated with GitHub Actions.
          files: |
            release/FLStudioRPC-linux-x64-${{ steps.new_version.outputs.new_version }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        if: success()
        shell: bash
        run: |
          echo "Release created successfully!"
          echo
          echo "Version: ${{ steps.new_version.outputs.new_tag }}"
          echo "Previous: ${{ steps.get_tag.outputs.current_tag }}"
          echo
          echo "Archive:"
          echo "FLStudioRPC-linux-x64-${{ steps.new_version.outputs.new_version }}.tar.gz"